name: Collect and publish Penn news
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11,17 * * 1-5'
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: penn-news-production
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      # sites.js can be edited from the monitor, so check and publish it first.
      - name: Publish shared source catalog
        run: python prepare_sources.py
      - name: Validate source list and monitor
        run: |
          python -m unittest discover -s tests
          node tests/monitor.cjs
          node --test tests/functions.test.mjs
      - run: python -m playwright install --with-deps chromium
      - name: Collect news on GitHub servers
        run: python scraper.py --out collected.json --concurrency 3
      - name: Validate and preserve previous results for failed sources
        run: python publish_snapshot.py
      - name: Save last known results for the next run
        run: |
          git config user.name 'Penn News Monitor'
          git config user.email 'monitor@users.noreply.github.com'
          git add public/data/latest.json public/data/sources.json public/sites.js
          git diff --cached --quiet || git commit -m 'Update shared news collection'
          git pull --rebase origin main
          git push origin HEAD:main
      # The site's helper (functions/api) reads its GitHub key from a Cloudflare
      # secret. The owner saves the key once as the repository secret
      # MONITOR_GITHUB_TOKEN; this hands it (and an optional MONITOR_PASSCODE)
      # to Cloudflare so the deploy below picks it up.
      - name: Pass the monitor's secrets to Cloudflare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'penn-news-monitor' }}
          MONITOR_GITHUB_TOKEN: ${{ secrets.MONITOR_GITHUB_TOKEN }}
          MONITOR_PASSCODE: ${{ secrets.MONITOR_PASSCODE }}
        run: |
          if [ -n "$MONITOR_GITHUB_TOKEN" ]; then
            printf '%s' "$MONITOR_GITHUB_TOKEN" | npx --yes wrangler@4 pages secret put GITHUB_TOKEN --project-name="$PAGES_PROJECT"
          else
            echo "No MONITOR_GITHUB_TOKEN repository secret yet: the monitor shows published results but cannot start collections or edit sources. Help explains the one-time setup."
          fi
          if [ -n "$MONITOR_PASSCODE" ]; then
            printf '%s' "$MONITOR_PASSCODE" | npx --yes wrangler@4 pages secret put MONITOR_PASSCODE --project-name="$PAGES_PROJECT"
          fi
      - name: Deploy the static dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'penn-news-monitor' }}
        run: npx --yes wrangler@4 pages deploy public --project-name="$PAGES_PROJECT" --branch=production
      - name: Verify the public collection
        env:
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'penn-news-monitor' }}
        run: python verify_deployment.py
