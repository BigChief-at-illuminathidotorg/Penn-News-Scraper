name: Collect and publish Penn news
on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Leave blank for all sources, or enter a source ID"
        required: false
        type: string
  schedule:
    # Daily Eastern time; timezone keeps these times stable through daylight saving.
    - cron: '0 8,13 * * *'
      timezone: 'America/New_York'
    - cron: '50 9 * * *'
      timezone: 'America/New_York'
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/archive/**'
permissions:
  contents: write
concurrency:
  group: penn-news-production
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      # sites.js can be edited from the monitor, so check and publish it first.
      - name: Publish shared source catalog
        run: python prepare_sources.py
      - name: Validate source list and monitor
        run: |
          python -m unittest discover -s tests
          node tests/monitor.cjs
          node tests/search.cjs
          node tests/staff.mjs
      - run: python -m playwright install --with-deps chromium
      - name: Collect news on GitHub servers
        env:
          SOURCE_ID: ${{ inputs.source_id }}
        run: python scraper.py --out collected.json --concurrency 3 --site "$SOURCE_ID"
      - name: Validate and preserve previous results for failed sources
        run: python publish_snapshot.py
      - name: Save last known results for the next run
        run: |
          git config user.name 'Penn News Monitor'
          git config user.email 'monitor@users.noreply.github.com'
          git add public/data/latest.json public/data/sources.json public/sites.js
          git diff --cached --quiet || git commit -m 'Update shared news collection'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy the static dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'penn-news-monitor' }}
        run: npx --yes wrangler@4 pages deploy public --project-name="$PAGES_PROJECT" --branch=production
      - name: Verify the public collection
        env:
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'penn-news-monitor' }}
        run: python verify_deployment.py

