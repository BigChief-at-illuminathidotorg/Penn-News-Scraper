name: Check monitor update
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python prepare_sources.py
      - run: python -m unittest discover -s tests
      - run: node tests/monitor.cjs
      - run: python -m playwright install --with-deps chromium
      - name: Launch the collector browser
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.set_content('<h1>Collector ready</h1>')
              assert page.locator('h1').inner_text() == 'Collector ready'
              browser.close()
          PY
      - name: Test page extraction in the browser
        run: python -m unittest discover -s tests -p "test_extract.py" -v
